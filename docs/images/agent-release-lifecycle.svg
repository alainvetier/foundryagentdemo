<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1520" viewBox="0 0 1200 1520" role="img" aria-labelledby="title desc">
  <title id="title">Whisker Works agent release pipeline</title>
  <desc id="desc">Read the numbered sample steps from top to bottom: review a change, run offline PR checks, merge and manually dispatch the release workflow, create an isolated staging candidate, compare exact baseline and candidate versions, enforce the evaluation gate, obtain protected environment approval, and save an approved release record. Evaluation failure or an error stops the release. Approval denial stops it too. The sample ends with promotion_status not_deployed. A separate dashed section describes future production promotion, monitoring, and rollback; those adapters are not implemented. This is an inactive reference sample, not a running pipeline.</desc>
  <defs>
    <marker id="arrow" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#087e74"/>
    </marker>
    <marker id="arrow-stop" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#b42332"/>
    </marker>
    <marker id="arrow-future" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #17243b; }
      .title { font-size: 32px; font-weight: 700; }
      .heading { font-size: 23px; font-weight: 700; }
      .body { font-size: 19px; fill: #334155; }
      .small { font-size: 18px; fill: #475569; }
      .label { font-size: 18px; font-weight: 600; fill: #087e74; }
      .red { fill: #b42332; }
      .edge { fill: none; stroke: #087e74; stroke-width: 2.5; marker-end: url(#arrow); }
      .stop { fill: none; stroke: #b42332; stroke-width: 2.5; marker-end: url(#arrow-stop); }
      .future { fill: none; stroke: #64748b; stroke-width: 2.5; stroke-dasharray: 8 5; marker-end: url(#arrow-future); }
    </style>
  </defs>
  <rect width="1200" height="1520" fill="#fff"/>
  <text x="40" y="52" class="title">How Whiskers earns an approved release</text>
  <text x="40" y="88" class="body">Inactive sample. Follow the teal arrows downward; red branches stop the release.</text>

  <rect x="40" y="140" width="640" height="100" rx="14" fill="#f5f0ff" stroke="#7952b3" stroke-width="2"/>
  <text x="62" y="176" class="heading">1. Review the change</text>
  <text x="62" y="207" class="body">Branch + PR: definition, instructions, tools, code and policy</text>
  <path d="M360 250 V290" class="edge"/>

  <rect x="40" y="300" width="640" height="100" rx="14" fill="#eff6ff" stroke="#2471b5" stroke-width="2"/>
  <text x="62" y="336" class="heading">2. Pass offline PR checks</text>
  <text x="62" y="367" class="body">Configuration tests + unit tests + source compilation</text>
  <path d="M360 410 V450" class="edge"/>
  <text x="390" y="436" class="label">Merge to main + manual release dispatch</text>

  <rect x="800" y="140" width="360" height="260" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="822" y="177" class="heading">Two sample workflows</text>
  <text x="822" y="215" class="body">PR checks: no Azure credentials.</text>
  <text x="822" y="253" class="body">Release: repeat offline checks,</text>
  <text x="822" y="282" class="body">then use OIDC only in staging.</text>
  <text x="822" y="327" class="small">Files remain outside the active</text>
  <text x="822" y="354" class="small">GitHub workflows directory.</text>
  <text x="822" y="381" class="small">Activate only after configuration.</text>

  <rect x="40" y="460" width="640" height="100" rx="14" fill="#ecfdf5" stroke="#087e74" stroke-width="2"/>
  <text x="62" y="496" class="heading">3. Create an isolated staging candidate</text>
  <text x="62" y="527" class="body">Capture the returned agent name, version and model</text>
  <path d="M360 570 V610" class="edge"/>

  <rect x="40" y="620" width="640" height="100" rx="14" fill="#ecfdf5" stroke="#087e74" stroke-width="2"/>
  <text x="62" y="656" class="heading">4. Evaluate exact versions</text>
  <text x="62" y="687" class="body">Explicit baseline vs candidate on the same read-only dataset</text>
  <path d="M360 730 V770" class="edge"/>

  <rect x="800" y="460" width="360" height="260" rx="14" fill="#fff7ed" stroke="#b86e24" stroke-width="2"/>
  <text x="822" y="497" class="heading">Sample gate policy</text>
  <text x="822" y="535" class="body">At least 7/8 keyword cases</text>
  <text x="822" y="564" class="body">No pass-rate regression</text>
  <text x="822" y="593" class="body">Required stock + lily cases pass</text>
  <text x="822" y="622" class="body">Latency + reported-token limits</text>
  <text x="822" y="651" class="body">Complete metrics + no retries</text>
  <text x="822" y="695" class="small">Not a formal safety certification.</text>

  <rect x="40" y="780" width="640" height="100" rx="14" fill="#fff7ed" stroke="#b86e24" stroke-width="2"/>
  <text x="62" y="816" class="heading">5. Enforce the evaluation gate</text>
  <text x="62" y="847" class="body">Check real observations; keep version and dataset evidence</text>
  <path d="M360 890 V930" class="edge"/>
  <text x="390" y="916" class="label">Pass</text>
  <path d="M690 830 H790" class="stop"/>
  <text x="710" y="810" class="label red">Fail</text>
  <rect x="800" y="780" width="360" height="100" rx="14" fill="#fff1f2" stroke="#b42332" stroke-width="2"/>
  <text x="822" y="816" class="heading red">STOP: do not approve</text>
  <text x="822" y="847" class="small">Any job error also stops release.</text>

  <rect x="40" y="940" width="640" height="100" rx="14" fill="#f5f0ff" stroke="#7952b3" stroke-width="2"/>
  <text x="62" y="976" class="heading">6. Wait for protected approval</text>
  <text x="62" y="1007" class="body">Configured environment reviewers inspect the evidence</text>
  <path d="M360 1050 V1090" class="edge"/>
  <text x="390" y="1076" class="label">Approved</text>
  <path d="M690 990 H790" class="stop"/>
  <text x="705" y="970" class="label red">Denied</text>
  <rect x="800" y="940" width="360" height="100" rx="14" fill="#fff1f2" stroke="#b42332" stroke-width="2"/>
  <text x="822" y="976" class="heading red" style="font-size:20px">STOP: keep current release</text>
  <text x="822" y="1007" class="small">No consumer switch is performed.</text>

  <rect x="40" y="1100" width="640" height="100" rx="14" fill="#ecfdf5" stroke="#087e74" stroke-width="2"/>
  <text x="62" y="1136" class="heading">7. Save an approved release record</text>
  <text x="62" y="1167" class="body">Exact versions + commit + input hashes + gate results</text>
  <rect x="800" y="1100" width="360" height="100" rx="14" fill="#ecfdf5" stroke="#087e74" stroke-width="2"/>
  <text x="822" y="1136" class="heading">Sample ends here</text>
  <text x="822" y="1167" class="small">promotion_status: not_deployed</text>

  <rect x="24" y="1246" width="1152" height="250" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="44" y="1285" class="heading">Future lifecycle: separate adapters, NOT implemented by the sample</text>
  <rect x="44" y="1320" width="290" height="105" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="62" y="1357" class="heading" style="font-size:20px">Promote the release</text>
  <text x="62" y="1389" class="small">Pin consumer / shift traffic</text>
  <path d="M344 1373 H445" class="future"/>
  <text x="354" y="1353" class="small">Canary</text>
  <rect x="455" y="1320" width="290" height="105" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="475" y="1357" class="heading" style="font-size:20px">Observe real behavior</text>
  <text x="475" y="1389" class="small">Quality, tools, latency, cost</text>
  <path d="M755 1373 H856" class="future"/>
  <text x="758" y="1353" class="small">If unhealthy</text>
  <rect x="866" y="1320" width="290" height="105" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="2"/>
  <text x="886" y="1357" class="heading" style="font-size:20px">Roll back the runtime</text>
  <text x="886" y="1389" class="small">Restore approved pin / revision</text>
  <text x="44" y="1468" class="small">Use the right adapter for prompt agents, Foundry-hosted Agent Framework code, or Container Apps.</text>
</svg>
