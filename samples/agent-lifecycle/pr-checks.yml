# INACTIVE SAMPLE: GitHub does not discover workflows in this directory.
name: whisker-agent-pr-checks
on:
  pull_request:
    paths:
      - agents/procode/**
      - agents/hosted/**
      - data/knowledge/**
      - data/sales/**
      - data/eval/**
      - scripts/check-agent-release.py
      - samples/agent-lifecycle/**
      - tests/**
      - .github/workflows/whisker-agent-*.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: whisker-agent-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r agents/procode/requirements.txt
      - name: Offline definition, evaluator, and release-gate tests
        run: |
          python -m unittest discover -s tests -p test_create_agent.py -v
          python -m unittest discover -s tests -p test_compare_models.py -v
          python -m unittest discover -s tests -p test_agent_release.py -v
      - name: Compile agent source without importing or invoking it
        run: python -m compileall -q agents/procode agents/hosted scripts/check-agent-release.py
