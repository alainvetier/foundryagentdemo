name: kernel-panic-ops
description: >
  Kernel Panic, Whisker Works' Head of DevOps cat. Ops analyst hosted agent built with
  Microsoft Agent Framework: sales analytics, purchase orders with approval, Store tools via APIM MCP.
metadata:
  tags:
    - Agent Framework
    - AI Agent Hosting
    - Responses Protocol
    - Whisker Works
template:
  name: kernel-panic-ops
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: APIM_GATEWAY_URL
      value: ${APIM_GATEWAY_URL}
    - name: APIM_MCP_PATH
      value: whisker-mcp
    - name: APIM_SUBSCRIPTION_KEY
      value: ${APIM_SUBSCRIPTION_KEY}
resources:
  - kind: model
    id: gpt-4.1-mini
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
